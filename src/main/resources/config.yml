http:
  port: 8050
  secret: alongrandomvalue
  # Leave blank to show the built-in privacy policy
  privacy_redirect: ''
  ip:
    read_from_header: true
    header_name: X-Forwarded-For

redis:
  host: localhost
  port: 6379
  user: default
  password: redis

mysql:
  host: localhost
  port: 3306
  database: snowcaptcha
  user: snowcaptcha
  password: snowcaptcha

s3:
  # Used to store region challenge images. Required when visual_challenge.region is enabled.
  # The endpoint must be reachable by end users as challenge images are served with presigned URLs.
  endpoint: ''
  region: us-east-1
  bucket: ''
  access_key: ''
  secret_key: ''
  # Enable this for most S3-compatible providers (MinIO, Ceph, etc.)
  path_style_access: true
  key_prefix: 'region-challenges/'
  # How often (in seconds) to check that S3 is reachable. Set to 0 to disable the check.
  health_check_interval: 300

visual_challenge:
  region:
    # When enabled, users who need a visual challenge will be asked to click part of an image
    # instead of typing a randomly generated string. Falls back to the text challenge if no
    # region challenges are available.
    enabled: false

reputation:
  project_honey_pot:
    enabled: false
    # Replace this with your own API key before enabling
    api_key: abcdefghijkl
    resolvers:
      - 8.8.8.8
      - 8.8.4.4
  bgp_tools:
    # Changes to the blacklist and whitelist may take two hours to apply
    # ASNs which should always receive a visual captcha
    blacklist:
      - AS15169
      - AS200101
    # ASNs which should report a good reputation to the ReputationTester
    # Note that other reputation sources could still report a bad reputation resulting in a visual captcha
    whitelist:
      - AS211869